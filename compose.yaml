name: foodpark

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app

    container_name: foodpark-app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads

    networks:
      - foodpark

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web

    container_name: foodpark-web

    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:80"

    depends_on:
      - app

    volumes:
      - storage_data:/var/www/html/storage:ro
      - uploads_data:/var/www/html/public/uploads:ro

    networks:
      - foodpark

  db:
    image: mysql:8.0

    container_name: foodpark-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - foodpark

volumes:
  mysql_data:
  storage_data:
  uploads_data:

networks:
  foodpark:
    driver: bridge
