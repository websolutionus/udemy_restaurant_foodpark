memory_limit = 256M

upload_max_filesize = 20M
post_max_size = 20M

max_execution_time = 60
max_input_time = 60

date.timezone = Europe/Warsaw

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
